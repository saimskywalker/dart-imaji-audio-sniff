name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    name: Dart ${{ matrix.sdk }} (VM)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest SDK the pubspec allows, and the current stable.
        sdk: ['3.5.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - name: Format
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test (includes a bounded fuzz run)
        run: dart test --reporter=expanded

  web:
    name: Web (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - name: Test in Chrome (dart:io tests are skipped there)
        run: dart test --platform chrome --reporter=expanded

  package:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - run: dart pub publish --dry-run
      - name: Example runs
        run: dart run example/main.dart
      - name: Leak scan (only when the LEAK_PATTERNS secret is set)
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: tool/leak_scan.sh
